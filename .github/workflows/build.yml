name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Получение исходников
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Wrapper и ключ подписи лежат в репозитории. Без них сборку не начинаем:
      # новый ключ означал бы, что обновление не встанет поверх установленной версии.
      - name: Проверка wrapper и ключа подписи
        run: |
          set -euo pipefail
          test -s keystore/debug.keystore
          test -s gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Модульные тесты
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Сборка APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      # Проверяется уже собранный файл: подпись тем же ключом, пакет, версия, отсутствие лишних разрешений.
      - name: Проверка готового APK
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          echo "Инструменты: $tools"
          "$tools/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
          cat "$RUNNER_TEMP/certs.txt"
          cert="$(keytool -exportcert -keystore keystore/debug.keystore -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)"
          grep -F "certificate SHA-256 digest: $cert" "$RUNNER_TEMP/certs.txt"
          "$tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/apk.txt"
          head -n 14 "$RUNNER_TEMP/apk.txt"
          grep -F "package: name='ru.dayplanner.app' versionCode='$GITHUB_RUN_NUMBER'" "$RUNNER_TEMP/apk.txt"
          # Разные версии aapt2 пишут минимальную версию как sdkVersion или minSdkVersion.
          grep -E "^(sdkVersion|minSdkVersion):'29'" "$RUNNER_TEMP/apk.txt"
          grep -E "^targetSdkVersion:'36'" "$RUNNER_TEMP/apk.txt"
          if grep -E "android\.permission\.(INTERNET|CAMERA|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA_IMAGES)'" "$RUNNER_TEMP/apk.txt"; then
            echo "В APK попало разрешение, которого быть не должно"
            exit 1
          fi

      - name: Выкладка APK
        uses: actions/upload-artifact@v4
        with:
          name: planner-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
