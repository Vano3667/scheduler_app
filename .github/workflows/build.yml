name: Сборка APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Получение исходников
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Выполняется по-настоящему только один раз: создаёт Gradle wrapper и ключ подписи
      # и сохраняет их в репозиторий. Дальше все сборки подписываются этим же ключом.
      - name: Подготовка wrapper и ключа подписи
        run: |
          set -euo pipefail
          changed=0
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            tmp="$(mktemp -d)"
            (cd "$tmp" && touch settings.gradle && gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon)
            mkdir -p gradle/wrapper
            cp "$tmp/gradlew" "$tmp/gradlew.bat" .
            cp "$tmp/gradle/wrapper/gradle-wrapper.jar" "$tmp/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/
            chmod +x gradlew
            changed=1
          fi
          if [ ! -f keystore/debug.keystore ]; then
            mkdir -p keystore
            keytool -genkeypair -keystore keystore/debug.keystore -storetype PKCS12 \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=Android Debug,O=Android,C=US"
            changed=1
          fi
          if [ "$changed" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f gradlew gradlew.bat gradle/wrapper keystore/debug.keystore
            git commit -m "Gradle wrapper и debug-ключ подписи (создано автоматически)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          chmod +x gradlew

      - name: Модульные тесты
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Сборка APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Выкладка APK
        uses: actions/upload-artifact@v4
        with:
          name: planner-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
