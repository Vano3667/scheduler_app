name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Подготовка Android SDK и проверка ключа
        run: |
          set -euo pipefail
          test -s keystore/debug.keystore
          test -s gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37' 'build-tools;36.0.0'
      - name: Модульные тесты
        run: ./gradlew --stacktrace testDebugUnitTest
      - name: Сборка APK
        run: ./gradlew --stacktrace assembleDebug
      - name: Проверка подписи, пакета, версии и разрешений готового APK
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
          cert=$(keytool -exportcert -keystore keystore/debug.keystore -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)
          grep -F "certificate SHA-256 digest: $cert" "$RUNNER_TEMP/certs.txt"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk.txt"
          grep -F "package: name='ru.dayplanner.app' versionCode='$GITHUB_RUN_NUMBER'" "$RUNNER_TEMP/apk.txt"
          grep -Fx "sdkVersion:'29'" "$RUNNER_TEMP/apk.txt"
          grep -Fx "targetSdkVersion:'37'" "$RUNNER_TEMP/apk.txt"
          "$tools/aapt" dump permissions "$apk" > "$RUNNER_TEMP/permissions.txt"
          if grep -Eq "android\.permission\.(INTERNET|CAMERA|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA_IMAGES)'" "$RUNNER_TEMP/permissions.txt"; then exit 1; fi
      - name: Выкладка APK
        uses: actions/upload-artifact@v4
        with:
          name: planner-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
